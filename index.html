<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mini" />
  <meta name="theme-color" content="#F6F0E8" />
  <meta name="description" content="Klein en kleurrijk: houd bewegingen en habits bij, één voor één." />
  <title>Mini</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <section id="view-home" class="view is-active"></section>
    <section id="view-detail" class="view" hidden></section>
    <section id="view-editor" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modal-cancel">Annuleren</button>
        <button type="button" class="btn btn-danger" id="modal-ok">Verwijderen</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
